---
services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_DB: docker_manager
            POSTGRES_USER: docker_manager
            POSTGRES_PASSWORD: docker_manager
        volumes:
            - postgres_data_simple:/var/lib/postgresql/data
        ports:
            - 5532:5432
        healthcheck:
            test: [CMD-SHELL, pg_isready -U docker_manager]
            interval: 10s
            timeout: 5s
            retries: 5

    backend:
        build:
            context: ./backend-simple
            dockerfile: Dockerfile
        environment:
            DATABASE_URL: postgresql://docker_manager:docker_manager@postgres:5432/docker_manager
            SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
            ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
            ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        ports:
            - 6500:6500
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        healthcheck:
            test: [CMD, curl, -f, "http://localhost:6500/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3

    redis:
        image: redis:7-alpine
        command: redis-server
        ports:
            - 6380:6379
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - 3050:80
        depends_on:
            - backend
        environment:
            REACT_APP_API_URL: http://localhost:6500/api

volumes:
    postgres_data_simple:

networks:
    default:
        name: docker-manager-simple-network
