[package]
name = "api-build"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
axum-login = { version = "0.18" }
tower-sessions = { version = "0.14",  features = ["memory-store"]}
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
config = "0.14"
nix = { version = "0.30", features = ["aio", "signal"] }
futures-util = "0.3"
futures = "0.3"
bollard = { version = "*", features = ["chrono"] }
log = "0.4"
simple_logger = "5.0"
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "openapi_extensions"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
utoipa-axum = "0.2"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "uuid", "chrono", "json"] }
anyhow = "1"
sysinfo = "0.30"
thiserror = "2.0.17"
sha2 = "0.10.9"
jsonwebtoken = { version = "10.0.0", features = ["aws_lc_rs"] }
