---
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docker_manager
      POSTGRES_USER: ${POSTGRES_USER:-docker_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docker_manager}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/create_users_table.sql:/docker-entrypoint-initdb.d/01_create_users_table.sql
      - ./database/create_admin_user.sh:/docker-entrypoint-initdb.d/02_create_admin_user.sh
    ports:
      - 5532:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U docker_manager]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docker-manager-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      RUST_ENV: ${RUST_ENV:-production}
      JWT_SECRET: ${JWT_SECRET}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 6500:6500
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, "http://localhost:6500/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - docker-manager-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3050:80
    depends_on:
      - backend
    networks:
      - docker-manager-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - 8088:80
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      - docker-manager-network

volumes:
  postgres_data:

networks:
  docker-manager-network:
    name: docker-manager-network
    driver: bridge
