---
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: docker_manager
      POSTGRES_USER: docker_manager
      POSTGRES_PASSWORD: docker_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - 5532:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U docker_manager]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      docker-manager-network:
        ipv4_address: 172.18.0.2

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      RUST_ENV: ${RUST_ENV:-production}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 6500:6500
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, "http://localhost:6500/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      docker-manager-network:
        ipv4_address: 172.18.0.3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3050:80
    depends_on:
      - backend
    networks:
      docker-manager-network:
        ipv4_address: 172.18.0.4

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - 8088:80
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks:
      docker-manager-network:
        ipv4_address: 172.18.0.5

volumes:
  postgres_data:

networks:
  docker-manager-network:
    name: docker-manager-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/24
