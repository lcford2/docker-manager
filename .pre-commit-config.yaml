# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
        exclude: ^.zed/settings.json
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
      - id: detect-private-key

  # Rust - cargo fmt and clippy
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (backend)
        entry: bash -c 'cd backend && cargo fmt'
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy (backend)
        entry: bash -c 'cd backend && cargo clippy --all-targets --all-features -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false

  # JavaScript/TypeScript - Local ESLint
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx eslint src/**'
        language: system
        # files: ^frontend/.*\.(js|jsx|ts|tsx)$
        args: [--fix, --max-warnings=0]
        pass_filenames: false

  # JavaScript/TypeScript - Local Prettier
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx prettier src/**'
        language: system
        # files: ^frontend/.*\.(js|jsx|ts|tsx|json|css|scss|html|md)$
        args: [--write]
        pass_filenames: false

  # Docker
  # - repo: https://github.com/hadolint/hadolint
  # rev: v2.12.0
  # hooks:
  # - id: hadolint-docker
  # args: [--ignore, DL3008, --ignore, DL3009]

# Configuration for pre-commit.ci
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: [cargo-fmt, cargo-clippy, eslint, prettier] # Skip local hooks in CI
  submodules: false
