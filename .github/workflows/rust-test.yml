name: Rust Tests and Coverage

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        rust: [stable]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --all -- --check

      - name: Run clippy
        working-directory: ./backend
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests with nextest
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: test_jwt_secret_for_ci_only_not_production
        run: cargo nextest run --all-features --workspace

      # Doctests are skipped because this is a binary-only crate (no lib.rs)
      # If you add a library target in the future, uncomment this step:
      # - name: Run doctests
      #   working-directory: ./backend
      #   env:
      #     DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      #     JWT_SECRET: test_jwt_secret_for_ci_only_not_production
      #   run: cargo test --doc --all-features --workspace

      - name: Generate coverage with llvm-cov
        working-directory: ./backend
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          JWT_SECRET: test_jwt_secret_for_ci_only_not_production
        run: |
          cargo llvm-cov --all-features --workspace --codecov --output-path ../codecov.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./codecov.json
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: backend
          name: backend-coverage

  # Optional: Test on multiple platforms
  test-cross-platform:
    name: Cross-Platform Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Run tests (no database tests on macOS/Windows)
        working-directory: ./backend
        env:
          JWT_SECRET: test_jwt_secret_for_ci_only_not_production
        run: |
          # Run only tests that don't require database
          cargo nextest run --all-features --workspace \
            --filter-expr 'not test(database)' || true

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
